services:
  goldinvest-gcp:
    build:
      context: .
      dockerfile: Dockerfile.gcp
    container_name: goldinvest-gcp
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/numi.sqlite
      SCRAPE_INTERVAL_SECONDS: "900"
    volumes:
      - ./data:/data
